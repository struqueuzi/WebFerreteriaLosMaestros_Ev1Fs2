<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería Los Maestros - Todos los Productos</title>
    <!-- Bootstrap 5 CDN (Idéntico a tus otras vistas) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" href="assets/imgs/329f5c6e4eaff31962d0f2cc0bd20b77.jpg" type="image/x-icon">
    <!-- Tu misma hoja CSS externa obligatoria -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <!-- HEADER Y NAV: Estructura semántica base idéntica -->
    <header class="sticky-top shadow-sm">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
            <div class="container gap-3">
                <a class="navbar-brand fw-bold fs-3 text-warning" href="index.html">🛠️ LOS MAESTROS</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <!-- Barra de búsqueda activa en tiempo real -->
                    <form class="d-flex flex-grow-1 mx-lg-4 my-3 my-lg-0" onsubmit="event.preventDefault();">
                        <div class="input-group">
                            <input type="text" id="buscador" class="form-control border-0 bg-white" placeholder="¿Qué buscas? Filtra por cemento, martillo, tubo...">
                            <button class="btn btn-warning fw-bold" type="button" id="btn-buscar">🔍</button>
                        </div>
                    </form>

                    <div class="d-flex align-items-center gap-3">
                        <a href="login.html" class="text-white text-decoration-none small text-center">👤 Mi Cuenta</a>
                        <a href="carrito.html" class="btn btn-outline-warning position-relative d-flex align-items-center gap-2 py-2 px-3">
                            <span>🛒</span>
                            <span class="fw-bold d-none d-sm-inline">Mi Carrito</span>
                            <span id="contador-carrito" class="badge bg-danger rounded-pill">0</span>
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Barra Secundaria de Categorías (Estilo retail) -->
        <div class="bg-secondary py-2 d-none d-md-block">
            <div class="container">
                <ul class="nav gap-4 small fw-bold">
                    <li class="nav-item"><a class="nav-link text-white p-0" href="index.html">🏠 Inicio</a></li>
                    <li class="nav-item"><a class="nav-link text-warning p-0" href="productos.html">🧱 Todos los Productos</a></li>
                    <li class="nav-item"><a class="nav-link text-white p-0" href="#">👷 Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link text-white p-0" href="#">📰 Noticias / Blog</a></li>
                    <li class="nav-item"><a class="nav-link text-white p-0" href="#">📞 Contacto</a></li>
                </ul>
            </div>
        </div>
    </header>

    <!-- MAIN: Contenedor Semántico para listar las referencias -->
    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <h1 class="fw-bold m-0">🛠️ Nuestro Catálogo Completo</h1>
            <p class="text-muted m-0">Mostrando artículos con stock en tiempo real</p>
        </div>

        <!-- Grilla donde JavaScript inyectará dinámicamente las tarjetas -->
        <section class="row g-4" id="contenedor-productos">
            <!-- Las tarjetas aparecerán aquí automáticamente -->
        </section>
    </main>

    <!-- FOOTER: Pie de página obligatorio -->
    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
             <p class="mb-0 small">© 2024 Ferretería Los Maestros. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <!-- Enlazamos la misma lógica del catálogo para reutilizar el arreglo e imágenes -->
    <script src="js/productos.js"></script>
</body>
</html>
