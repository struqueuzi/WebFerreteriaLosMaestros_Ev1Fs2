<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería Los Maestros | Panel Administrador</title>

    <link rel="icon" href="assets/imgs/329f5c6e4eaff31962d0f2cc0bd20b77.jpg" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- HEADER Y NAV BASE -->
  <header class="sticky-top shadow-sm">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
      <div class="container gap-3">
        <a class="navbar-brand fw-bold fs-3 text-warning" href="index.html">🛠️ LOS MAESTROS</a>
        <div class="d-flex align-items-center gap-3 ms-auto">
          <span id="correo-usuario" class="text-white small fw-bold"></span>
          <button id="btn-cerrar-sesion" class="btn btn-outline-warning btn-sm">Cerrar sesión</button>
        </div>
      </div>
    </nav>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="container my-5 flex-grow-1">

    <div class="card shadow-sm border-0 p-4 rounded-3 mb-4">
      <h1 id="titulo-bienvenida" class="fw-bold mb-0">Panel Administrador</h1>
    </div>

    <!-- Gestión de Usuarios -->
    <div class="card shadow-sm border-0 p-4 rounded-3 mb-4">
      <h2 class="fw-bold mb-3">Usuarios registrados</h2>
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Correo</th>
              <th>RUT</th>
              <th>Teléfono</th>
              <th>Rol</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="lista-usuarios">
            <!-- Inyección dinámica por panel-admin.js -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Gestión de Productos -->
    <div class="card shadow-sm border-0 p-4 rounded-3 mb-4">
      <h2 class="fw-bold mb-3">Gestión de productos</h2>
      <div class="row g-4" id="lista-productos-admin">
        <!-- Inyección dinámica por panel-admin.js -->
      </div>

      <hr class="my-4">

      <h3 class="fw-bold mb-3">Agregar producto nuevo</h3>
      <form id="form-nuevo-producto" class="row g-3">
        <div class="col-12 col-md-6">
          <label class="form-label fw-bold" for="nuevo-nombre">Nombre del producto</label>
          <input type="text" class="form-control" id="nuevo-nombre" required>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label fw-bold" for="nuevo-precio">Precio ($)</label>
          <input type="number" class="form-control" id="nuevo-precio" min="0" required>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label fw-bold" for="nuevo-stock">Stock inicial</label>
          <input type="number" class="form-control" id="nuevo-stock" min="0" required>
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label fw-bold" for="nuevo-imagen">Ruta de Imagen</label>
          <input type="text" class="form-control" id="nuevo-imagen" placeholder="assets/imgs/producto.jpg" required>
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label fw-bold" for="nuevo-categoria">Categoría</label>
          <select id="nuevo-categoria" class="form-select">
            <option value="Herramientas manuales">Herramientas manuales</option>
            <option value="Herramientas eléctricas">Herramientas eléctricas</option>
            <option value="Materiales de construcción">Materiales de construcción</option>
          </select>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-warning fw-bold">Agregar producto</button>
        </div>
      </form>
    </div>

  </main>

  <!-- FOOTER BASE -->
  <footer class="bg-dark text-white py-4 mt-auto" style="border-top: 4px solid #ffc107;">
    <div class="container text-center">
      <p class="mb-0 small">Ferretería Los Maestros — Av. Las Industrias 1234, Puente Alto, Santiago</p>
      <p class="mb-0 small">&copy; 2026 Ferretería Los Maestros. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="js/datos.js"></script>
  <script src="js/panel-admin.js"></script>
</body>
</html>
