<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferretería Los Maestros | Panel Administrador</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <header class="sticky-top shadow-sm">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
      <div class="container">
        <a class="navbar-brand fw-bold fs-3 text-warning" href="index.html">🛠️ LOS MAESTROS</a>
        <div class="d-flex align-items-center gap-3">
          <span id="correo-usuario" class="text-white small fw-bold"></span>
          <button id="btn-cerrar-sesion" class="btn btn-outline-warning btn-sm">Cerrar Sesión</button>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5 flex-grow-1">
    <div class="card shadow-sm border-0 p-4 rounded-3 mb-4">
      <h1 class="fw-bold mb-0">Panel de Administración</h1>
    </div>

    <!-- Usuarios -->
    <div class="card shadow-sm border-0 p-4 rounded-3 mb-4">
      <h3 class="fw-bold mb-3">👥 Usuarios Registrados</h3>
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Correo</th>
              <th>RUT</th>
              <th>Teléfono</th>
              <th>Rol</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="lista-usuarios"></tbody>
        </table>
      </div>
    </div>

    <!-- Productos -->
    <div class="card shadow-sm border-0 p-4 rounded-3 mb-4">
      <h3 class="fw-bold mb-3">🧱 Catálogo de Productos</h3>
      <div class="row g-3 mb-4" id="lista-productos-admin"></div>

      <hr>

      <h4 class="fw-bold mb-3">➕ Agregar Nuevo Producto</h4>
      <form id="form-nuevo-producto" class="row g-3">
        <div class="col-12 col-md-6">
          <label class="form-label fw-bold" for="nuevo-nombre">Nombre</label>
          <input type="text" class="form-control" id="nuevo-nombre" required>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label fw-bold" for="nuevo-precio">Precio ($)</label>
          <input type="number" class="form-control" id="nuevo-precio" min="0" required>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label fw-bold" for="nuevo-stock">Stock Inicial</label>
          <input type="number" class="form-control" id="nuevo-stock" min="0" required>
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label fw-bold" for="nuevo-imagen">URL de la Imagen</label>
          <input type="text" class="form-control" id="nuevo-imagen" placeholder="https://..." required>
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label fw-bold" for="nuevo-categoria">Categoría</label>
          <select id="nuevo-categoria" class="form-select">
            <option value="Herramientas manuales">Herramientas manuales</option>
            <option value="Herramientas eléctricas">Herramientas eléctricas</option>
            <option value="Materiales de construcción">Materiales de construcción</option>
          </select>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-warning fw-bold">Guardar Producto</button>
        </div>
      </form>
    </div>
  </main>

  <footer class="bg-dark text-white py-4 mt-auto" style="border-top: 4px solid #ffc107;">
    <div class="container text-center">
      <p class="mb-0 small">&copy; 2026 Ferretería Los Maestros. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="js/datos.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/panel_admin.js"></script>
</body>
</html>
