<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería Los Maestros | Crear cuenta</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-light">

  <header class="sticky-top shadow-sm">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
      <div class="container gap-3">
        <a class="navbar-brand fw-bold fs-3 text-warning" href="index.html">🛠️ LOS MAESTROS</a>
        <div class="d-flex align-items-center gap-3 ms-auto">
          <a href="index.html" class="text-white text-decoration-none small">Volver a la tienda</a>
          <a href="login.html" class="btn btn-outline-warning btn-sm">Iniciar sesión</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-7 col-lg-6">
        <div class="card shadow-sm border-0 p-4 rounded-3">
          <h1 class="fw-bold mb-4">Crear cuenta</h1>

          <form id="form-registro">
            <div class="mb-3">
              <label for="nombre" class="form-label fw-bold">Nombre completo</label>
              <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ej: Juan Pérez" required>
            </div>

            <div class="mb-3">
              <label for="rut" class="form-label fw-bold">RUT</label>
              <input type="text" id="rut" name="rut" class="form-control" placeholder="Ej: 12345678-9" required>
            </div>

            <div class="mb-3">
              <label for="correo" class="form-label fw-bold">Correo electrónico</label>
              <input type="email" id="correo" name="correo" class="form-control" placeholder="nombre@correo.com" required>
            </div>

            <div class="mb-3">
              <label for="telefono" class="form-label fw-bold">Teléfono</label>
              <input type="tel" id="telefono" name="telefono" class="form-control" placeholder="Ej: +56912345678" required>
            </div>

            <div class="mb-3">
              <label for="clave" class="form-label fw-bold">Contraseña</label>
              <input type="password" id="clave" name="clave" class="form-control" required>
            </div>

            <p id="mensaje-error" class="text-danger small"></p>

            <button type="submit" class="btn btn-warning w-100 fw-bold py-2">Crear cuenta</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white py-4 mt-5" style="border-top: 4px solid #ffc107;">
    <div class="container text-center">
      <p class="mb-0 small">Ferretería Los Maestros — Av. Las Industrias 1234, Puente Alto, Santiago</p>
      <p class="mb-0 small">&copy; 2026 Ferretería Los Maestros. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
