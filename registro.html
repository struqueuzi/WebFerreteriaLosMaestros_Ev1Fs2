<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería Los Maestros | Crear cuenta</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header>
    <a href="login.html" class="logo">Ferretería Los Maestros</a>
    <nav>
      <ul>
        <li><a href="login.html">Iniciar sesión</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h1>Crear cuenta</h1>

      <form id="form-registro">

        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="rut">RUT</label>
        <input type="text" id="rut" name="rut" placeholder="Ej: 12345678-9" required>

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" required>

        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" name="telefono" placeholder="Ej: +56912345678" required>

        <label for="clave">Contraseña</label>
        <input type="password" id="clave" name="clave" required>

        <p id="mensaje-error"></p>

        <button type="submit">Crear cuenta</button>

      </form>
    </section>
  </main>

  <footer>
    <p>Ferretería Los Maestros — Av. Las Industrias 1234, Puente Alto, Santiago</p>
    <p>&copy; 2026 Ferretería Los Maestros. Todos los derechos reservados.</p>
  </footer>

  <script src="js/datos.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
