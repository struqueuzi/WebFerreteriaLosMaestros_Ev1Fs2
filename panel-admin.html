<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería Los Maestros | Panel Administrador</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header>
    <a href="panel-admin.html" class="logo">Ferretería Los Maestros</a>
    <nav>
      <ul>
        <li><span id="correo-usuario"></span></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h1 id="titulo-bienvenida">Panel Administrador</h1>
      <button id="btn-cerrar-sesion">Cerrar sesión</button>
    </section>

    <section>
      <h2>Usuarios registrados</h2>
      <div id="lista-usuarios"></div>
    </section>

    <section>
      <h2>Gestión de productos</h2>
      <div id="lista-productos-admin"></div>

      <h3>Agregar producto nuevo</h3>
      <form id="form-nuevo-producto">
        <label>Nombre: <input type="text" id="nuevo-nombre" required></label>
        <label>Precio: <input type="number" id="nuevo-precio" min="0" required></label>
        <label>Stock inicial: <input type="number" id="nuevo-stock" min="0" required></label>
        <label>Imagen (ruta): <input type="text" id="nuevo-imagen" placeholder="img/nombre.jpg" required></label>
        <button type="submit">Agregar producto</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Ferretería Los Maestros — Av. Las Industrias 1234, Puente Alto, Santiago</p>
    <p>&copy; 2026 Ferretería Los Maestros. Todos los derechos reservados.</p>
  </footer>

  <script src="js/datos.js"></script>
  <script src="js/panel-admin.js"></script>
</body>
</html>
