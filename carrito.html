<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferretería Los Maestros | Carrito</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <header class="sticky-top shadow-sm">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
      <div class="container">
        <a class="navbar-brand fw-bold fs-3 text-warning" href="index.html">🛠️ LOS MAESTROS</a>
        <div class="d-flex align-items-center gap-3" id="seccion-usuario-nav"></div>
      </div>
    </nav>
  </header>

  <main class="container my-5 flex-grow-1">
    <h1 class="fw-bold mb-4">🛒 Mi Carrito de Compras</h1>

    <div class="row g-4">
      <div class="col-12 col-lg-8">
        <div class="card shadow-sm border-0 p-4 rounded-3">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Producto</th>
                  <th>Precio</th>
                  <th>Cantidad</th>
                  <th>Subtotal</th>
                  <th>Acción</th>
                </tr>
              </thead>
              <tbody id="tabla-carrito"></tbody>
            </table>
          </div>

          <div id="carrito-vacio" class="text-center py-4 d-none">
            <p class="text-muted fs-5">Tu carrito está vacío.</p>
            <a href="productos.html" class="btn btn-warning fw-bold">Ver Productos</a>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-4">
        <div class="card shadow-sm border-0 p-4 rounded-3">
          <h4 class="fw-bold mb-3">Resumen de Compra</h4>
          <div class="d-flex justify-content-between mb-3 fs-5">
            <span>Total:</span>
            <span class="fw-bold text-primary fs-4" id="total-compra">$0</span>
          </div>

          <hr>

          <form id="form-checkout">
            <div class="mb-3">
              <label for="tipoEntrega" class="form-label small fw-bold">Tipo de Entrega</label>
              <select class="form-select" id="tipoEntrega" required>
                <option value="retiro">Retiro en Tienda (Puente Alto)</option>
                <option value="despacho">Despacho a Domicilio</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="direccion" class="form-label small fw-bold">Dirección de Despacho / Contacto</label>
              <input type="text" class="form-control" id="direccion" placeholder="Ej: Av. Las Industrias 1234, C3" required>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold py-2">Confirmar Pedido</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white py-4 mt-auto" style="border-top: 4px solid #ffc107;">
    <div class="container text-center">
      <p class="mb-0 small">&copy; 2026 Ferretería Los Maestros. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="js/datos.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/carrito.js"></script>
</body>
</html>
