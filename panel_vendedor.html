<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferretería Los Maestros | Panel Vendedor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <header class="sticky-top shadow-sm">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
      <div class="container">
        <a class="navbar-brand fw-bold fs-3 text-warning" href="index.html">🛠️ LOS MAESTROS</a>
        <div class="d-flex align-items-center gap-3">
          <span id="correo-usuario" class="text-white small fw-bold"></span>
          <button id="btn-cerrar-sesion" class="btn btn-outline-warning btn-sm">Cerrar Sesión</button>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5 flex-grow-1">
    <div class="card shadow-sm border-0 p-4 rounded-3 mb-4">
      <h1 class="fw-bold mb-0">Panel de Control Vendedor</h1>
    </div>

    <div class="card shadow-sm border-0 p-4 rounded-3 mb-4">
      <h3 class="fw-bold mb-3">📦 Gestión de Inventario</h3>
      <div class="row g-3" id="lista-inventario"></div>
    </div>

    <div class="card shadow-sm border-0 p-4 rounded-3">
      <h3 class="fw-bold mb-3">📋 Pedidos Recibidos</h3>
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Cliente</th>
              <th>Productos</th>
              <th>Total</th>
              <th>Estado Actual</th>
              <th>Actualizar Estado</th>
            </tr>
          </thead>
          <tbody id="lista-pedidos-vendedor"></tbody>
        </table>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white py-4 mt-auto" style="border-top: 4px solid #ffc107;">
    <div class="container text-center">
      <p class="mb-0 small">&copy; 2026 Ferretería Los Maestros. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="js/datos.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/panel-vendedor.js"></script>
</body>
</html>
