<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería Los Maestros | Iniciar sesión</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header>
    <a href="login.html" class="logo">Ferretería Los Maestros</a>
    <nav>
      <ul>
        <li><a href="registro.html">Crear cuenta</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h1>Iniciar sesión</h1>

      <form id="form-login">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" required>

        <label for="clave">Contraseña</label>
        <input type="password" id="clave" name="clave" required>

        <p id="mensaje-error"></p>

        <button type="submit">Iniciar sesión</button>
      </form>

      <p>¿No tienes cuenta? <a href="registro.html">Crea una aquí</a></p>
    </section>
  </main>

  <footer>
    <p>Ferretería Los Maestros — Av. Las Industrias 1234, Puente Alto, Santiago</p>
    <p>&copy; 2026 Ferretería Los Maestros. Todos los derechos reservados.</p>
  </footer>

  <script src="js/datos.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
