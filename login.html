<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería Los Maestros | Iniciar Sesión</title>

    <link rel="icon" href="assets/imgs/329f5c6e4eaff31962d0f2cc0bd20b77.jpg" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- HEADER Y NAV BASE -->
  <header class="sticky-top shadow-sm">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
      <div class="container gap-3">
        <a class="navbar-brand fw-bold fs-3 text-warning" href="index.html">🛠️ LOS MAESTROS</a>
        <div class="d-flex align-items-center gap-3 ms-auto">
          <a href="index.html" class="text-white text-decoration-none small">Volver a la Tienda</a>
        </div>
      </div>
    </nav>

    <div class="bg-secondary py-2 d-none d-md-block">
      <div class="container">
        <ul class="nav gap-4 small fw-bold">
          <li class="nav-item"><a class="nav-link text-white p-0" href="index.html">🏠 Inicio</a></li>
          <li class="nav-item"><a class="nav-link text-white p-0" href="productos.html">🧱 Todos los Productos</a></li>
          <li class="nav-item"><a class="nav-link text-white p-0" href="carrito.html">🛒 Carrito</a></li>
          <li class="nav-item"><a class="nav-link text-warning p-0" href="login.html">🔑 Iniciar Sesión</a></li>
        </ul>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 p-4 rounded-3">
          <h1 class="fw-bold mb-4">Iniciar sesión</h1>

          <form id="form-login">
            <div class="mb-3">
              <label for="correo" class="form-label fw-bold">Correo electrónico</label>
              <input type="email" id="correo" name="correo" class="form-control" required placeholder="ejemplo@duoc.cl">
            </div>

            <div class="mb-3">
              <label for="clave" class="form-label fw-bold">Contraseña</label>
              <input type="password" id="clave" name="clave" class="form-control" required>
            </div>

            <p id="mensaje-error" class="text-danger small"></p>

            <button type="submit" class="btn btn-warning w-100 fw-bold py-2">Iniciar sesión</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER BASE -->
  <footer class="bg-dark text-white py-4 mt-auto" style="border-top: 4px solid #ffc107;">
    <div class="container text-center">
      <p class="mb-0 small">Ferretería Los Maestros — Av. Las Industrias 1234, Puente Alto, Santiago</p>
      <p class="mb-0 small">&copy; 2026 Ferretería Los Maestros. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="js/datos.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
