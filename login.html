<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferretería Los Maestros | Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <header class="sticky-top shadow-sm">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
      <div class="container">
        <a class="navbar-brand fw-bold fs-3 text-warning" href="index.html">🛠️ LOS MAESTROS</a>
        <a href="index.html" class="btn btn-outline-warning btn-sm">Volver a la tienda</a>
      </div>
    </nav>
  </header>

  <main class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow-sm border-0 p-4 rounded-3">
          <h2 class="fw-bold mb-4 text-center">Iniciar Sesión</h2>

          <form id="form-login">
            <div class="mb-3">
              <label for="correo" class="form-label fw-bold">Correo Electrónico</label>
              <input type="email" id="correo" class="form-control" required placeholder="ejemplo@maestros.cl">
            </div>

            <div class="mb-3">
              <label for="clave" class="form-label fw-bold">Contraseña</label>
              <input type="password" id="clave" class="form-control" required>
            </div>

            <p id="mensaje-error" class="text-danger small"></p>

            <button type="submit" class="btn btn-warning w-100 fw-bold py-2">Ingresar</button>
          </form>

          <div class="mt-4 pt-3 border-top text-muted small">
            <strong>Cuentas de prueba:</strong>
            <ul class="mb-0 ps-3 mt-1">
              <li>Cliente: <code>cliente@maestros.cl</code> / <code>cliente123</code></li>
              <li>Vendedor: <code>vendedor@maestros.cl</code> / <code>vendedor123</code></li>
              <li>Admin: <code>admin@maestros.cl</code> / <code>admin123</code></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white py-4 mt-auto" style="border-top: 4px solid #ffc107;">
    <div class="container text-center">
      <p class="mb-0 small">&copy; 2026 Ferretería Los Maestros. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="js/datos.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
