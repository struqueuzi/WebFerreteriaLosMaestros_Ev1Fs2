<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería Los Maestros | Iniciar sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-light">

  <header class="sticky-top shadow-sm">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
      <div class="container gap-3">
        <a class="navbar-brand fw-bold fs-3 text-warning" href="index.html">🛠️ LOS MAESTROS</a>
        <div class="d-flex align-items-center gap-3 ms-auto">
          <a href="index.html" class="text-white text-decoration-none small">Volver a la tienda</a>
          <a href="registro.html" class="btn btn-outline-warning btn-sm">Crear cuenta</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 p-4 rounded-3">
          <h1 class="fw-bold mb-4">Iniciar sesión</h1>

          <form id="form-login">
            <div class="mb-3">
              <label for="correo" class="form-label fw-bold">Correo electrónico</label>
              <input type="email" id="correo" name="correo" class="form-control" required>
            </div>

            <div class="mb-3">
              <label for="clave" class="form-label fw-bold">Contraseña</label>
              <input type="password" id="clave" name="clave" class="form-control" required>
            </div>

            <p id="mensaje-error" class="text-danger"></p>

            <button type="submit" class="btn btn-warning w-100 fw-bold py-2">Iniciar sesión</button>
          </form>

          <p class="mt-3 mb-0 text-center">¿No tienes cuenta? <a href="registro.html">Crea una aquí</a></p>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white py-4 mt-5" style="border-top: 4px solid #ffc107;">
    <div class="container text-center">
      <p class="mb-0 small">Ferretería Los Maestros — Av. Las Industrias 1234, Puente Alto, Santiago</p>
      <p class="mb-0 small">&copy; 2026 Ferretería Los Maestros. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="js/datos.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
