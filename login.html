<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <main>
    <!-- Título de la página -->
    <h1>Iniciar sesión</h1>

    <!-- id="form-login" para poder encontrarlo desde JavaScript -->
    <form id="form-login">

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" name="correo" required>

      <label for="clave">Contraseña</label>
      <input type="password" id="clave" name="clave" required>

      <!-- Acá mostraremos el error si el correo o la contraseña están mal -->
      <p id="mensaje-error"></p>

      <button type="submit">Iniciar sesión</button>

    </form>

    <!-- Link para quien todavía no tiene cuenta -->
    <p>¿No tienes cuenta? <a href="registro.html">Crea una aquí</a></p>
  </main>
    <script src="js/datos.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
